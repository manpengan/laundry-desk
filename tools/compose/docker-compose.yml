services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laundry_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD-}"
      LAUNDRY_APP_PASSWORD: "${LAUNDRY_APP_PASSWORD-}"
    ports:
      - "127.0.0.1:8543:5432"
    volumes:
      - ./bootstrap-roles.sh:/docker-entrypoint-initdb.d/00-bootstrap-roles.sh:ro
      - pgdata-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laundry_v2"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: laundry-v2-server-integration
    command: ["bash", "tools/compose/migrate-v2.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: laundry_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD-}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    image: laundry-v2-server-integration
    profiles: ["bootstrap"]
    command:
      ["node", "apps/server/dist/local/bootstrap-cli.js", "--confirm", "laundry-desk-v2-local"]
    environment:
      DATABASE_ADMIN_URL: "postgresql://postgres:${POSTGRES_PASSWORD-}@postgres:5432/laundry_v2"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: laundry-v2-server-integration
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: "postgresql://laundry_app:${LAUNDRY_APP_PASSWORD-}@postgres:5432/laundry_v2"
      LAUNDRY_ACCESS_TOKEN_SECRET: "${LAUNDRY_ACCESS_TOKEN_SECRET-}"
      LAUNDRY_CSRF_PROOF_SECRET: "${LAUNDRY_CSRF_PROOF_SECRET-}"
      LAUNDRY_CONTAINER_RUNTIME: "1"
      LAUNDRY_LAN_ORIGIN: "${LAUNDRY_LAN_ORIGIN-}"
      LAUNDRY_USE_LOCAL_PG: "1"
      LAUNDRY_PHOTO_STORE_DIR: "/var/lib/laundry/photos"
      # Mock printer output (product design §7). Explicitly configured and well
      # outside any web-served root. Deliberately NOT a named volume: it lives
      # in the container layer, so `local:down` reclaims it and the ownership-
      # validated volume lifecycle keeps managing exactly one volume. Artifacts
      # are reachable through the authenticated download route while the stack
      # is up, and retention caps the directory regardless.
      LAUNDRY_PRINT_SPOOL_DIR: "/var/lib/laundry/print-spool"
    volumes:
      - "${LAUNDRY_LOCAL_CONFIG_DIR:?LAUNDRY_LOCAL_CONFIG_DIR is required}/photos:/var/lib/laundry/photos"
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8787/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata-v2:
    labels:
      com.laundry-desk.managed: "true"
      com.laundry-desk.project: "${COMPOSE_PROJECT_NAME-laundry-desk}"
      com.laundry-desk.instance: "${LAUNDRY_LOCAL_INSTANCE_ID-}"
