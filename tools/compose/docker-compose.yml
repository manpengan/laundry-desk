services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laundry_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password # LOCAL ONLY
    ports:
      - "8543:5432"
    volumes:
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - pgdata-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laundry_v2"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: laundry-v2-server-integration
    command: ["bash", "tools/compose/migrate-v2.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: laundry_v2
      SUPERUSER_DATABASE_URL: postgresql://postgres:postgres_secure_password@postgres:5432/laundry_v2
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    image: laundry-v2-server-integration
    profiles: ["bootstrap"]
    command:
      ["node", "apps/server/dist/local/bootstrap-cli.js", "--confirm", "laundry-desk-v2-local"]
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:postgres_secure_password@postgres:5432/laundry_v2
      LAUNDRY_BOOTSTRAP_ADMIN_USERNAME: "${LAUNDRY_BOOTSTRAP_ADMIN_USERNAME:?set bootstrap administrator username}"
      LAUNDRY_BOOTSTRAP_ADMIN_DISPLAY_NAME: "${LAUNDRY_BOOTSTRAP_ADMIN_DISPLAY_NAME:?set bootstrap administrator display name}"
      LAUNDRY_BOOTSTRAP_ADMIN_PASSWORD: "${LAUNDRY_BOOTSTRAP_ADMIN_PASSWORD:?set bootstrap administrator password}"
      LAUNDRY_BOOTSTRAP_ADMIN_PIN: "${LAUNDRY_BOOTSTRAP_ADMIN_PIN:?set bootstrap administrator PIN}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: laundry-v2-server-integration
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://laundry_app:app_secure_password@postgres:5432/laundry_v2
      LAUNDRY_ACCESS_TOKEN_SECRET: "${LAUNDRY_ACCESS_TOKEN_SECRET:?set access-token signing secret}"
      LAUNDRY_CSRF_PROOF_SECRET: "${LAUNDRY_CSRF_PROOF_SECRET:?set CSRF proof signing secret}"
      LAUNDRY_CONTAINER_RUNTIME: "1"
      LAUNDRY_USE_LOCAL_PG: "1"
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8787/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata-v2:
