name: V2 Windows Runtime Payload

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "tools/windows-runtime/**"
      - "apps/server/**"
      - "packages/contracts/**"
      - "packages/domain/**"
      - "packages/platform-fs/**"
      - "packages/db/src/migrations/**"
      - "packages/db/src/README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/windows-runtime.yml"

permissions:
  contents: read

jobs:
  windows-runtime-payload:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.0
          run_install: false
      - name: Install locked build dependencies
        run: pnpm.cmd install --frozen-lockfile
      - name: Test payload validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Write-SourceCheckpoint([string]$Stage) {
            $gitOptions = @('--no-optional-locks', '-c', 'core.fsmonitor=false', '-c', 'core.hooksPath=NUL', '-c', 'core.quotepath=false')
            $head = git.exe @gitOptions rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_COMPANION_SOURCE_CHECKPOINT_FAILED' }
            $tracked = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            @(git.exe @gitOptions ls-files) | ForEach-Object { [void]$tracked.Add($_) }
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_COMPANION_SOURCE_CHECKPOINT_FAILED' }
            $records = @(git.exe @gitOptions status --porcelain=v1 --untracked-files=all)
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_COMPANION_SOURCE_CHECKPOINT_FAILED' }
            $known = @($records | Where-Object { $_.Length -ge 4 -and $tracked.Contains($_.Substring(3)) })
            $changed = @($known | Select-Object -First 32 | ForEach-Object { @{ status=$_.Substring(0,2); path=$_.Substring(3) } })
            $untracked = @($records | Where-Object { $_.StartsWith('?? ') })
            $metadata = @($untracked | Select-Object -First 32 | ForEach-Object {
              $relative = $_.Substring(3)
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $nameHash = [Convert]::ToHexString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($relative))).ToLowerInvariant() }
              finally { $sha.Dispose() }
              $candidateName = if ($relative -cin @('NUL','nul')) { $relative } else { $null }
              $suffix = [regex]::Match($relative.ToLowerInvariant(),'\.([a-z0-9]{1,16})$').Groups[1].Value
              $suffixKind = if ($suffix -cin @('ps1','lnk','dll','pdb','tmp','json')) { $suffix } elseif ($relative -notmatch '\.') { 'none' } else { 'other' }
              $kind = 'unavailable'
              try {
                $parts = @($relative.Split('/'))
                if ($relative.Length -gt 240 -or $relative -match '[\\:\x00-\x1f]' -or @($parts | Where-Object { $_ -cin @('','.', '..') }).Count -ne 0) { throw 'INVALID' }
                $candidate = $env:GITHUB_WORKSPACE
                for ($index=0; $index -lt $parts.Count; $index++) {
                  $candidate = [IO.Path]::Combine($candidate,$parts[$index])
                  # GetAttributes reports the object itself; stop before entering any reparse point.
                  $attributes = [IO.File]::GetAttributes('\\?\' + $candidate)
                  if (($attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { $kind='reparse'; break }
                  $directory = ($attributes -band [IO.FileAttributes]::Directory) -ne 0
                  if ($index -eq ($parts.Count - 1)) { $kind=if($directory){'directory'}else{'file'} }
                  elseif (-not $directory) { throw 'INVALID' }
                }
              } catch { $kind='unavailable' }
              # No unknown path or file content is published or read, including a literal NUL file.
              @{ name_sha256=$nameHash; public_candidate=$candidateName; suffix_kind=$suffixKind; kind=$kind }
            })
            $report = [ordered]@{
              stage=$Stage; head_matches=($head -ceq $env:GITHUB_SHA); status_count=$records.Count
              tracked_changed=$changed; tracked_truncated=($known.Count -gt 32)
              untracked_count=$untracked.Count; untracked_metadata=$metadata; untracked_truncated=($untracked.Count -gt 32)
              unknown_count=($records.Count - $known.Count)
            }
            # Publish only public tracked paths; unknown filenames and file contents stay private.
            [Console]::WriteLine('WINDOWS_COMPANION_SOURCE_CHECKPOINT ' + ($report | ConvertTo-Json -Compress -Depth 4))
          }
          Write-SourceCheckpoint 'before_validation'
          $trackedTests = @(git.exe ls-files -- 'tools/windows-runtime/*.test.mjs' | Sort-Object)
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_COMPANION_TEST_SET_INVALID' }
          $globTests = @(Get-ChildItem -LiteralPath 'tools/windows-runtime' -Filter '*.test.mjs' -File | ForEach-Object { 'tools/windows-runtime/' + $_.Name } | Sort-Object)
          if ($trackedTests.Count -lt 1 -or $trackedTests.Count -gt 64 -or @($trackedTests | Where-Object { $_ -cnotmatch '^tools/windows-runtime/[a-z0-9-]+\.test\.mjs$' }).Count -ne 0 -or @(Compare-Object -ReferenceObject $trackedTests -DifferenceObject $globTests -CaseSensitive).Count -ne 0) {
            throw 'WINDOWS_COMPANION_TEST_SET_INVALID'
          }
          [Console]::WriteLine('WINDOWS_COMPANION_TEST_SET ' + (@{ count=$trackedTests.Count; files=$trackedTests } | ConvertTo-Json -Compress))
          $validationExit = 0
          foreach ($testFile in $trackedTests) {
            node.exe --test $testFile
            if ($LASTEXITCODE -ne 0) { $validationExit = 1 }
            Write-SourceCheckpoint ('after/' + $testFile)
          }
          Write-SourceCheckpoint 'after_validation'
          if ($validationExit -ne 0) { exit $validationExit }
      - name: Download pinned upstream archives and build payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = node.exe --input-type=module -e "import {COMPANION_SOURCES as s} from './tools/windows-runtime/companion-sources.mjs'; console.log(JSON.stringify(s));" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_COMPANION_SOURCE_INVALID' }
          $crt = node.exe --input-type=module -e "import {CRT_SOURCE as s} from './tools/windows-runtime/companion-crt-source.mjs'; console.log(JSON.stringify(s));" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_COMPANION_CRT_SOURCE_INVALID' }
          $nodeZip = Join-Path $env:RUNNER_TEMP 'laundry-node.zip'
          $pgZip = Join-Path $env:RUNNER_TEMP 'laundry-postgres.zip'
          $crtArchive = Join-Path $env:RUNNER_TEMP 'laundry-vc-redist-x64.exe'
          Invoke-WebRequest $sources.node.url -OutFile $nodeZip
          Invoke-WebRequest $sources.postgres.url -OutFile $pgZip
          Invoke-WebRequest $crt.url -OutFile $crtArchive
          $output = @(pnpm.cmd runtime:win:package --source-sha $env:GITHUB_SHA --node-archive $nodeZip --postgres-archive $pgZip --crt-archive $crtArchive --release 0.1.0-win-dev)
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_COMPANION_BUILD_FAILED' }
          $report = ($output | Where-Object { $_ -match '^\{' } | Select-Object -Last 1) | ConvertFrom-Json
          if ($report.manifest_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'WINDOWS_COMPANION_REPORT_INVALID' }
          $payload = Join-Path $env:RUNNER_TEMP 'laundry-no-repo-runtime'
          Copy-Item -LiteralPath $report.output -Destination $payload -Recurse
          $entry = Join-Path $env:RUNNER_TEMP 'laundry-runtime-operator-entry'
          node.exe tools/windows-runtime/package-runtime-entry.mjs --payload $payload --manifest-sha $report.manifest_sha256 --source-sha $env:GITHUB_SHA --output $entry
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_RUNTIME_ENTRY_BUILD_FAILED' }
          "LAUNDRY_RUNTIME_ENTRY=$entry" >> $env:GITHUB_ENV
          "LAUNDRY_PAYLOAD=$payload" >> $env:GITHUB_ENV
          "LAUNDRY_MANIFEST_SHA256=$($report.manifest_sha256)" >> $env:GITHUB_ENV
          $report | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'runtime-build-result.json')
      - name: Load packaged runtime outside the repository
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $trustedNode = (Get-Command node.exe).Source
          $acceptance = Join-Path $env:RUNNER_TEMP 'lifecycle-acceptance.mjs'
          foreach ($name in @('lifecycle-acceptance.mjs','lifecycle-acceptance-command.mjs','backup-acceptance.mjs')) {
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE "tools/windows-runtime/$name") (Join-Path $env:RUNNER_TEMP $name)
          }
          $hiddenSource = Join-Path $env:RUNNER_TEMP 'laundry-source-unavailable'
          if (Test-Path -LiteralPath $hiddenSource) { throw 'WINDOWS_COMPANION_SOURCE_BACKUP_EXISTS' }
          New-Item -ItemType Directory -Path $hiddenSource | Out-Null
          try {
            # The runner may hold the checkout root open. Move every child, including
            # .git and node_modules, and prove the original checkout is empty.
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | ForEach-Object {
              Move-Item -LiteralPath $_.FullName -Destination $hiddenSource -Force
            }
            if (@(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force).Count -ne 0) {
              throw 'WINDOWS_COMPANION_SOURCE_STILL_AVAILABLE'
            }
            & $trustedNode "$env:LAUNDRY_PAYLOAD/scripts/smoke-companion.mjs" $env:LAUNDRY_PAYLOAD $env:LAUNDRY_MANIFEST_SHA256
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_COMPANION_SMOKE_FAILED' }
            $savedPath = $env:PATH
            try {
              $env:PATH = Join-Path $env:SystemRoot 'System32'
              $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
              & "$env:LAUNDRY_PAYLOAD/node/node.exe" $acceptance $env:LAUNDRY_PAYLOAD $env:LAUNDRY_MANIFEST_SHA256 (Join-Path $env:RUNNER_TEMP 'runtime-lifecycle-result.json')
              if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_COMPANION_LIFECYCLE_ACCEPTANCE_FAILED' }
              # The acceptance harness installs the runtime before its final uninstall;
              # status on a fresh runner correctly rejects an installation that does not exist.
              $entryStatus = & $powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $env:LAUNDRY_RUNTIME_ENTRY 'runtime-entry.ps1') -Action status
              if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_RUNTIME_ENTRY_NO_REPO_FAILED' }
              $entryReport = $entryStatus | ConvertFrom-Json
              if ($entryReport -isnot [pscustomobject] -or $entryReport.status -isnot [string] -or $entryReport.assurance -isnot [string] -or $entryReport.source_git_sha -isnot [string] -or $entryReport.manifest_sha256 -isnot [string] -or
                  $entryReport.status -cne 'uninstalled' -or $entryReport.assurance -cne 'development_only' -or $entryReport.source_git_sha -cne $env:GITHUB_SHA -or $entryReport.manifest_sha256 -cne $env:LAUNDRY_MANIFEST_SHA256) {
                throw 'WINDOWS_RUNTIME_ENTRY_NO_REPO_RESULT_INVALID'
              }
              $entryStatus
            } finally { $env:PATH = $savedPath }
          } finally {
            Get-ChildItem -LiteralPath $hiddenSource -Force | ForEach-Object {
              Move-Item -LiteralPath $_.FullName -Destination $env:GITHUB_WORKSPACE -Force
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-runtime-development-payload
          path: |
            ${{ runner.temp }}/laundry-no-repo-runtime
            ${{ runner.temp }}/runtime-build-result.json
            ${{ runner.temp }}/runtime-lifecycle-result.json
            ${{ runner.temp }}/laundry-runtime-operator-entry
          if-no-files-found: error
          include-hidden-files: true
