name: V2 Foundation

on:
  workflow_dispatch:
  # No paths filter: this job is a required status check on main. A required
  # check that is skipped never reports, which blocks the pull request forever
  # (a docs-only or .claude-only change used to match nothing here).
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  workspace-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies without native lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build SQLite binding for Node migration tests
        run: pnpm --filter @laundry/migrate-v1 rebuild better-sqlite3

      - name: Check workspace foundation
        run: pnpm run workspace:check

  runtime-app-macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint native runtime Swift sources
        run: pnpm run runtime:app:lint:swift

      - name: Build, inspect, and run no-repo Runtime and LAN acceptance
        run: pnpm run runtime:app:acceptance

      - name: Verify portable release-candidate evidence and native verifier
        run: pnpm run release:candidate:swift:check && pnpm run release:candidate:test

      - name: Build, inspect, and smoke unsigned Counter package
        run: pnpm run local:mac:software:acceptance
