name: V2 PostgreSQL Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 0"
  # No paths filter: this job is a required status check on main. A required
  # check that is skipped never reports, which blocks the pull request forever.
  # Costs a full run on every PR; that is cheaper than a stuck merge queue or a
  # red main.
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build SQLite binding for Node migration tests
        run: pnpm --filter @laundry/migrate-v1 rebuild better-sqlite3

      - name: Check workspace foundation
        run: pnpm run workspace:check

      - name: Prepare isolated integration environment
        shell: bash
        run: |
          set -euo pipefail
          admin_password="$(openssl rand -hex 36)"
          admin_pin="$(node -e 'console.log(require("node:crypto").randomInt(100000, 1000000))')"
          printf '::add-mask::%s\n' "${admin_password}"
          printf '::add-mask::%s\n' "${admin_pin}"
          {
            printf 'COMPOSE_PROJECT_NAME=laundry-ci-%s-%s\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
            printf 'LAUNDRY_LOCAL_CONFIG_DIR=%s/laundry-v2-%s-%s\n' \
              "${RUNNER_TEMP}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
            printf 'LAUNDRY_BOOTSTRAP_ADMIN_PASSWORD=%s\n' "${admin_password}"
            printf 'LAUNDRY_BOOTSTRAP_ADMIN_PIN=%s\n' "${admin_pin}"
            printf 'LAUNDRY_BOOTSTRAP_ADMIN_USERNAME=%s\n' 'admin'
            printf 'LAUNDRY_BOOTSTRAP_ADMIN_DISPLAY_NAME=%s\n' 'Local Administrator'
            printf 'LAUNDRY_LOCAL_ORG_CODE=%s\n' 'local'
            printf 'LAUNDRY_LOCAL_STORE_CODE=%s\n' 'main'
          } >> "${GITHUB_ENV}"

      - name: Generate and mask external local secrets
        run: |
          node --input-type=module <<'NODE'
          import { ensureLocalConfig } from "./tools/local/config.mjs";

          const config = await ensureLocalConfig({ env: process.env });
          for (const secret of [
            config.postgresSuperuserPassword,
            config.postgresAppPassword,
            config.accessTokenSecret,
            config.csrfProofSecret,
          ]) {
            process.stdout.write(`::add-mask::${secret}\n`);
          }
          NODE

      - name: Verify repeatable lifecycle, migrations, and explicit bootstrap
        run: |
          pnpm local:up -- --bootstrap
          pnpm local:up -- --bootstrap

      - name: Assert RLS and real server HTTP smoke
        run: |
          bash tools/compose/smoke-rls.sh
          bash tools/compose/smoke-test.sh

      - name: Create and restore-drill a private recovery set
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pnpm local:maintenance
          recovery_metadata="${RUNNER_TEMP}/laundry-recovery-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -f -- "${recovery_metadata}"' EXIT
          node --input-type=module > "${recovery_metadata}" <<'NODE'
          import { createHash } from "node:crypto";
          import { createReadStream } from "node:fs";
          import { readdir } from "node:fs/promises";
          import { join } from "node:path";
          import { resolveLocalConfigPaths } from "./tools/local/config.mjs";

          const backupDirectory = join(resolveLocalConfigPaths().directoryPath, "backups");
          const names = (await readdir(backupDirectory))
            .filter((name) => /^laundry-v2-backup-.*\.dump$/u.test(name))
            .sort();
          const file = join(backupDirectory, names.at(-1));
          const hash = createHash("sha256");
          for await (const chunk of createReadStream(`${file}.bundle.json`)) hash.update(chunk);
          process.stdout.write(`${file}\n${hash.digest("hex")}\n`);
          NODE
          readarray -t recovery < "${recovery_metadata}"
          pnpm local:restore:drill -- \
            --file "${recovery[0]}" \
            --confirm-sha256 "${recovery[1]}"

      - name: Run server tests against real PostgreSQL with no skips
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          node --input-type=module <<'NODE' | tee /tmp/laundry-server-pg-tests.log
          import { spawn } from "node:child_process";
          import { ensureLocalConfig } from "./tools/local/config.mjs";

          const config = await ensureLocalConfig({ env: process.env });
          const databaseUrl = (username, password) => {
            const url = new URL("postgresql://127.0.0.1:8543/laundry_v2");
            url.username = username;
            url.password = password;
            return url.toString();
          };
          const child = spawn("pnpm", ["--filter", "@laundry/server", "test"], {
            env: {
              ...process.env,
              LAUNDRY_USE_LOCAL_PG: "1",
              POSTGRES_PASSWORD: config.postgresSuperuserPassword,
              LAUNDRY_APP_PASSWORD: config.postgresAppPassword,
              LAUNDRY_PG_APP_URL: databaseUrl("laundry_app", config.postgresAppPassword),
              DATABASE_ADMIN_URL: databaseUrl("postgres", config.postgresSuperuserPassword),
            },
            shell: false,
            stdio: "inherit",
          });
          child.once("error", () => {
            process.exitCode = 1;
          });
          child.once("exit", (code) => {
            process.exitCode = code ?? 1;
          });
          NODE
          ! rg -q '^# skipped [1-9][0-9]*$' /tmp/laundry-server-pg-tests.log

      - name: Install Chromium for local Web smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright against real server and PostgreSQL
        run: pnpm run local:web:e2e

      - name: Capture integration diagnostics
        if: failure()
        run: |
          docker compose -p "${COMPOSE_PROJECT_NAME}" \
            -f tools/compose/docker-compose.yml logs --no-color \
            > /tmp/laundry-compose.log || true

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-integration-diagnostics
          path: |
            /tmp/laundry-compose.log
            /tmp/laundry-server-pg-tests.log
          if-no-files-found: ignore

      - name: Stop compose
        if: always()
        run: |
          pnpm local:down || true
          docker volume rm "${COMPOSE_PROJECT_NAME}_pgdata-v2" >/dev/null 2>&1 || true
