name: V2 Windows Counter Installed

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/edge-agent/**"
      - "apps/server/**"
      - "packages/**"
      - "tools/local/**"
      - "tools/windows-runtime/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/windows-counter.yml"
      - ".github/workflows/windows-runtime.yml"

permissions:
  contents: read

jobs:
  runtime:
    uses: ./.github/workflows/windows-runtime.yml
  counter-installed:
    needs: runtime
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        profile: [generic, hongfa]
    env:
      LAUNDRY_WINDOWS_DISTRIBUTION_PROFILE: ${{ matrix.profile }}
      LAUNDRY_WINDOWS_BUILD_GIT_SHA: ${{ github.sha }}
      PLAYWRIGHT_NO_COPY_PROMPT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm.cmd install --frozen-lockfile
      - name: Check Electron preparation and static Runtime binding on Windows
        if: matrix.profile == 'generic'
        run: >-
          node --test apps/edge-agent/scripts/prepare-windows-electron.test.mjs
          apps/edge-agent/scripts/inspect-runtime-maintenance.test.mjs
      - uses: actions/download-artifact@v8
        with:
          name: windows-runtime-development-payload
          path: ${{ runner.temp }}/paired-runtime
      - name: Bind the same-source Runtime entry
        shell: pwsh
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'paired-runtime/laundry-runtime-operator-entry'
          $evidence = Get-Content -LiteralPath (Join-Path $entry 'release-evidence.json') -Raw | ConvertFrom-Json
          if ($evidence.source_git_sha -cne $env:GITHUB_SHA -or $evidence.assurance -cne 'development_only') { throw 'COUNTER_RUNTIME_SOURCE_MISMATCH' }
          "LAUNDRY_WINDOWS_RUNTIME_ENTRY=$entry" >> $env:GITHUB_ENV
          "LAUNDRY_MANIFEST_SHA256=$($evidence.manifest_sha256)" >> $env:GITHUB_ENV
      - name: Build the active V2 server and Counter NSIS
        shell: pwsh
        run: |
          pnpm.cmd exec turbo run build --filter=@laundry/server
          if ($LASTEXITCODE -ne 0) { throw 'COUNTER_SERVER_BUILD_FAILED' }
          pnpm.cmd --filter @laundry/edge-agent package:win
          if ($LASTEXITCODE -ne 0) { throw 'COUNTER_PACKAGE_FAILED' }
          pnpm.cmd --filter @laundry/edge-agent package:inspect:win
          if ($LASTEXITCODE -ne 0) { throw 'COUNTER_INSPECTION_FAILED' }
      - name: Check Windows native files and desktop recovery regressions
        if: matrix.profile == 'generic'
        run: >-
          node --test packages/platform-fs/scripts/*.test.mjs
          "packages/platform-fs/dist/**/*.test.js"
          apps/edge-agent/dist/desktop/receive-recovery.test.js
          apps/edge-agent/dist/desktop/maintenance-operation.test.js
          apps/edge-agent/scripts/windows-functional-evidence.test.mjs
      - name: Install NSIS and verify installed source and hashes
        shell: pwsh
        run: ./apps/edge-agent/scripts/ci-install-windows.ps1 -Profile '${{ matrix.profile }}'
      - name: Check installed Electron security and missing-service UX
        run: pnpm.cmd --filter @laundry/edge-agent package:smoke:win
      - name: Check installed login and synthetic order restart recovery
        run: pnpm.cmd exec playwright test -c apps/edge-agent/playwright.electron.windows-ci.config.ts windows-installed-ci.spec.ts
      - name: Install the paired native Runtime with synthetic data
        shell: pwsh
        run: ./apps/edge-agent/scripts/ci-runtime-pair.ps1 -Action install
      - name: Verify installed Counter backup health and maintenance window
        run: pnpm.cmd exec playwright test -c apps/edge-agent/playwright.electron.windows-ci.config.ts windows-installed-maintenance-ci.spec.ts
      - name: Stop and unregister the synthetic Runtime
        if: always() && env.LAUNDRY_RUNTIME_PAIR_INSTALLED == 'true'
        shell: pwsh
        run: ./apps/edge-agent/scripts/ci-runtime-pair.ps1 -Action uninstall
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-counter-${{ matrix.profile }}-development-only
          path: |
            apps/edge-agent/release/${{ matrix.profile }}/*-windows-x64-development-only.exe
            apps/edge-agent/test-results/windows-package/desktop-smoke.png
            ${{ runner.temp }}/counter-installed-${{ matrix.profile }}.json
            ${{ runner.temp }}/counter-maintenance-${{ matrix.profile }}.json
          if-no-files-found: warn
